packages:
  - apps/*
  - packages/*
  - oxlint-plugin-repo
  - scripts

allowBuilds:
  esbuild: true
  "@tsc-rs/typescript": true
  workerd: true

catalog:
  "@alchemy.run/cloudflare": 2.0.0-beta.85
  "@base-ui/react": 1.9.0
  "@cloudflare/workers-types": 5.20261103.1
  "@effect/atom-react": 4.1.2
  "@effect/platform-node": 4.1.2
  "@effect/vitest": 4.1.2
  # Must equal the oxlint version vite-plus bundles, or JS plugins load against a different AST.
  "@oxlint/plugins": 1.89.0
  "@shadcn/lint": 0.1.5
  "@tailwindcss/vite": 4.3.3
  "@tanstack/react-router": 1.170.46
  "@tanstack/react-start": 1.169.4
  "@types/node": 24.12.4
  "@types/react": ~19.3.0
  "@types/react-dom": ~19.3.0
  "@vitejs/plugin-react": 6.2.1
  alchemy: 2.0.0-beta.85
  oxc-transform-react: ~0.152.0
  effect: 4.1.2
  react: 19.3.0
  react-dom: 19.3.0
  tailwindcss: 4.3.3
  typescript: npm:@tsc-rs/typescript@0.8.0
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
  yaml: ^2.9.0

minimumReleaseAgeExclude:
  - "@tsc-rs/*"
  - "@alchemy.run/node-utils@2.0.0-beta.85"
  - alchemy@2.0.0-beta.85
  - "@alchemy.run/acme@2.0.0-beta.85"
  - "@alchemy.run/cloudflare-runtime@2.0.0-beta.85"
  - "@alchemy.run/cloudflare@2.0.0-beta.85"
  - "@alchemy.run/docker@2.0.0-beta.85"
  - "@alchemy.run/sql@2.0.0-beta.85"
  - "@cloudflare/workers-types@5.20261103.1"
  - "@distilled.cloud/acme@1.0.0-rc.18"
  - "@distilled.cloud/aws4signer@1.0.0-rc.18"
  - "@distilled.cloud/aws@1.0.0-rc.18"
  - "@distilled.cloud/cloudflare@1.0.0-rc.18"
  - "@distilled.cloud/core@1.0.0-rc.18"
  - "@distilled.cloud/iceberg@1.0.0-rc.18"

overrides:
  "@effect/vitest>vitest": "-"
  effect: "catalog:"
  vite: "catalog:"
  vite-plus: "catalog:"

packageExtensions:
  # The patch makes @effect/vitest import vite-plus/test, so tests share vp's vitest.
  "@effect/vitest@*":
    dependencies:
      vite-plus: "catalog:"

patchedDependencies:
  "@effect/vitest@4.1.2": patches/@effect__vitest@4.1.2.patch

peerDependencyRules:
  allowAny:
    - typescript
    - vite
  allowedVersions:
    vite: "*"

# Dependencies may ship agent skills into .claude/skills. We curate our own in .agents/skills.
permissions:
  "@tanstack/router-plugin":
    skills: false
